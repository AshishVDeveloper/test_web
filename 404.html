<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diwali Greetings</title>
<!--
  GitHub Pages shows this page for any address that is not a real file.
  It turns short links into real ones:
    /test_web/<token>   -> /test_web/?t=<token>
    /test_web/generate  -> /test_web/generate.html
-->
<script>
(function () {
  var parts = location.pathname.split('/');
  var last = decodeURIComponent(parts.pop() || parts.pop() || '');
  var base = parts.join('/') + '/';
  if (/^generate(\.php)?$/i.test(last)) location.replace(base + 'generate.html' + location.search + location.hash);
  else if (/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(last)) location.replace(base + '?t=' + encodeURIComponent(last));
  else location.replace(base);
})();
</script>
</head>
<body style="background:#1d0730"></body>
</html>
