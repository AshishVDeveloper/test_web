<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  index.html — reads a token and shows that employee's Diwali greeting page.
    Open: index.html?t=<token>   (also works as  index.html#<token>  or  /<token>  on GitHub Pages / Apache)
  The token holds only name, department and image. Tokens are made by generate.html.
  All decoration is drawn in code, so no extra image files are needed.
  Settings (leader name, message, secret key) are in config.js.
-->
<title>Diwali Greetings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playball&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lora:wght@400;500&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root {
  color-scheme: dark;
  --plum-900: #1d0730;
  --plum-800: #2d0b47;
  --plum-700: #4a1060;
  --wine: #6b0d4f;
  --wine-deep: #3e0a3e;
  --gold: #e9be69;
  --gold-light: #ffe7a6;
  --gold-deep: #b67c26;
  --parchment: #fff4dc;
  --parchment-deep: #f6dfb2;
  --ink: #3a1140;
  --rani: #9b0f5f;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --script: "Playball", "Brush Script MT", "Playfair Display", cursive;
  --sign: "Great Vibes", "Brush Script MT", cursive;
  --text: "Lora", Georgia, serif;
  --deva: "Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--plum-900);
  color: var(--parchment);
  font-family: var(--text);
  font-size: 1rem;
  line-height: 1.55;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.poster {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 70% 26% at 50% 12%, rgb(155 40 190 / .5), transparent 70%),
    linear-gradient(180deg, #24093d 0, var(--plum-800) 26%, #3b0c4e 50%, var(--wine-deep) 72%, #2a0a35 100%);
}

/* Corner decoration */
.corner {
  position: absolute;
  top: 0;
  width: clamp(150px, 34vw, 430px);
  height: auto;
  overflow: visible;
  z-index: 4;
  pointer-events: none;
}
.corner.l { left: 0; }
.corner.r { right: 0; transform: scaleX(-1); }
.swing { transform-origin: 132px 20px; animation: swing 4.5s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }

/* Ribbons */
.ribbon {
  position: relative;
  display: inline-block;
  padding: .32em 2.1em .38em;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold-light), var(--gold-deep));
  clip-path: polygon(1.1em 0, calc(100% - 1.1em) 0, 100% 50%, calc(100% - 1.1em) 100%, 1.1em 100%, 0 50%);
  isolation: isolate;
  color: var(--gold-light);
  font-family: var(--serif);
}
.ribbon::before {
  content: "";
  position: absolute;
  inset: 2px;
  z-index: -1;
  background: linear-gradient(180deg, var(--wine), var(--wine-deep));
  clip-path: inherit;
}

/* Header */
.head {
  position: relative;
  text-align: center;
  padding-top: clamp(20px, 3vw, 34px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.head > *:not(.sky) { position: relative; z-index: 2; }
.from { font-size: clamp(.8125rem, 2.3vw, 1.5rem); max-width: 62vw; }
.shubh {
  margin: clamp(12px, 2vw, 22px) 0 0;
  font-family: var(--deva);
  font-size: clamp(1.125rem, 3vw, 1.75rem);
  line-height: 1.4;
  color: var(--gold);
}
.happy {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.75rem, 5.4vw, 3.75rem);
  line-height: 1.05;
  color: var(--gold-light);
  text-shadow: 0 2px 10px rgb(255 190 80 / .4);
}
.title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 clamp(4px, 2vw, 22px); }
.title-row .happy { order: -1; flex-basis: 100%; }
.title-row svg { width: clamp(38px, 7vw, 84px); height: auto; overflow: visible; flex: none; }
.diwali {
  margin: 0;
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(4.25rem, 15vw, 10.5rem);
  line-height: 1.02;
  padding-inline: .1em;
  background: linear-gradient(100deg, #b67c26 0, #ffe7a6 22%, #fff9df 34%, #e9be69 50%, #fff2bd 68%, #c78d2f 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 2px rgb(70 20 0 / .8)) drop-shadow(0 0 22px rgb(255 190 80 / .4));
  animation: shine 7s linear infinite alternate;
}
@keyframes shine { to { background-position: 100% 0; } }
.fol { font-style: italic; font-size: clamp(.9375rem, 2.6vw, 1.625rem); }
.sky { position: absolute; left: 0; right: 0; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 0; }
.city {
  display: block;
  width: 100%;
  height: min(30vw, 480px);
  margin-top: clamp(-90px, -5vw, -14px);
  position: relative;
  z-index: 1;
  overflow: visible;
}

/* Hero: portrait + letter */
.hero {
  position: relative;
  z-index: 3;
  max-width: 1160px;
  margin: clamp(-190px, -12vw, -20px) auto 0;
  padding-left: max(16px, min(5vw, 64px), env(safe-area-inset-left, 0px));
  padding-right: max(16px, min(5vw, 64px), env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 9fr) minmax(0, 11fr);
  gap: clamp(24px, 4vw, 44px);
  align-items: center;
}
.arch-wrap { position: relative; width: 100%; max-width: 470px; justify-self: center; padding-bottom: 28px; }
.arch { position: relative; aspect-ratio: 100 / 120; max-width: 100%; }
.photo {
  position: absolute;
  inset: 0;
  clip-path: url(#archClip);
  background: radial-gradient(circle at 25% 25%, #ffb84a 0 3px, transparent 4px) 0 0 / 54px 54px,
              radial-gradient(circle at 70% 60%, #ffcf7a 0 4px, transparent 5px) 0 0 / 68px 68px,
              linear-gradient(180deg, #3a1450, #1d0730);
}
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
.initials {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  font-family: var(--serif);
  font-size: clamp(4.5rem, 14vw, 8rem);
  color: var(--gold-light);
  text-shadow: 0 3px 16px rgb(255 180 70 / .7);
}
.arch-frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 12px rgb(255 190 80 / .6)); pointer-events: none; }
.arch-flowers { position: absolute; left: -7%; right: -7%; bottom: 0; width: 114%; height: auto; overflow: visible; pointer-events: none; }
.plate {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: max-content;
  max-width: 94%;
  text-align: center;
  padding: .45em 2.2em .55em;
  line-height: 1.2;
  z-index: 2;
}
.plate strong { display: block; font-weight: 700; font-size: clamp(1.125rem, 2.3vw, 1.5rem); color: #fff4cf; overflow-wrap: anywhere; }
.plate span { display: block; font-size: clamp(.75rem, 1.3vw, .875rem); font-style: italic; color: var(--gold-light); }

.letter {
  position: relative;
  min-width: 0;
  margin-top: 26px;
  padding: 60px clamp(30px, 4vw, 46px) 48px;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 40%, #fffaf0, var(--parchment) 55%, var(--parchment-deep));
  border: 2px solid var(--gold);
  outline: 1px solid var(--gold-deep);
  outline-offset: -9px;
  border-radius: 30px;
  box-shadow: 0 0 34px rgb(255 190 80 / .45), 0 18px 40px rgb(0 0 0 / .45);
}
.crest { position: absolute; top: -40px; left: 50%; width: 136px; height: auto; margin-left: -68px; overflow: visible; }
.flourish { position: absolute; width: 44px; height: 44px; fill: none; stroke: var(--gold-deep); stroke-width: 1.4; }
.flourish.tl { top: 14px; left: 14px; }
.flourish.tr { top: 14px; right: 14px; transform: scaleX(-1); }
.flourish.bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
.flourish.br { bottom: 14px; right: 14px; transform: scale(-1); }
.letter h2 { margin: 0 0 12px; font-family: var(--serif); font-size: clamp(1.375rem, 2.6vw, 1.75rem); color: var(--rani); line-height: 1.2; }
.letter p { margin: 0 0 12px; font-size: clamp(1rem, 1.6vw, 1.125rem); }
.letter .wish { margin-bottom: 0; }
.letter .wish strong { display: block; font-family: var(--serif); font-size: clamp(1.25rem, 2.4vw, 1.625rem); line-height: 1.25; color: var(--rani); }
.sign { margin-top: 18px; display: grid; }
.sign em { font-style: normal; font-size: .9375rem; }
.sign strong { font-family: var(--sign); font-weight: 400; font-size: clamp(2rem, 3.6vw, 2.625rem); line-height: 1.15; color: #4c1762; }
.sign span { font-size: .875rem; color: #6b4a6b; }

/* Floor scene */
.floor { display: block; position: relative; z-index: 2; width: 100%; max-width: 1400px; height: auto; margin-inline: auto; margin-top: clamp(-14px, -1vw, 0px); overflow: visible; }

/* Blessings */
.blessings {
  position: relative;
  z-index: 3;
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  list-style: none;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: clamp(2px, 2vw, 22px);
}
.blessings li { min-width: 0; display: grid; justify-items: center; gap: 6px; }
.blessings svg { width: min(100%, 150px); height: auto; overflow: visible; }
.blessings .ic { fill: none; stroke: #ffdf95; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
.tag {
  width: 100%;
  max-width: 156px;
  padding: .3em .55em .36em;
  font-size: clamp(.625rem, 2.15vw, 1.125rem);
  text-align: center;
  clip-path: polygon(.6em 0, calc(100% - .6em) 0, 100% 50%, calc(100% - .6em) 100%, .6em 100%, 0 50%);
}

/* Closing */
.closing {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: center;
  padding: clamp(24px, 4vw, 40px) max(16px, env(safe-area-inset-right, 0px)) clamp(32px, 5vw, 56px) max(16px, env(safe-area-inset-left, 0px));
}
.closing .ribbon { display: flex; align-items: center; gap: clamp(8px, 2vw, 20px); max-width: 860px; padding: .7em 2em; font-style: italic; font-size: clamp(.9375rem, 2.3vw, 1.5rem); line-height: 1.3; text-align: center; }
.closing svg { width: clamp(30px, 5vw, 58px); height: auto; flex: none; overflow: visible; }
.closing p { margin: 0; min-width: 0; }
.mandala { position: absolute; bottom: -90px; width: clamp(140px, 24vw, 300px); height: auto; fill: none; stroke: #e0559e; stroke-width: 1.2; opacity: .38; }
.mandala.l { left: -70px; }
.mandala.r { right: -70px; }

/* Live motion */
.fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.3s ease-in-out infinite alternate; }
@keyframes flicker {
  0% { transform: scale(1, 1) skewX(-2deg); }
  50% { transform: scale(.9, 1.1) skewX(2.5deg); }
  100% { transform: scale(1.04, .94) skewX(-1deg); }
}
.gl { animation: pulse 1.9s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .72; } to { opacity: 1; } }
.tw { animation: twinkle 2.8s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

.notice { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
.notice h1 { margin: 8px 0; font-family: var(--serif); font-size: clamp(1.75rem, 5vw, 2.75rem); color: var(--gold-light); }

/* Large desktop screens */
@media (min-width: 1500px) {
  .corner { width: clamp(430px, 28vw, 620px); }
  .from { font-size: 1.75rem; }
  .shubh { font-size: 2.125rem; }
  .happy { font-size: 4.5rem; }
  .diwali { font-size: 13rem; }
  .title-row svg { width: 104px; }
  .fol { font-size: 1.875rem; }
  .hero { max-width: 1460px; }
  .arch-wrap { max-width: 590px; }
  .plate strong { font-size: 1.875rem; }
  .plate span { font-size: 1.0625rem; }
  .letter { padding: 72px 64px 58px; }
  .letter h2 { font-size: 2.125rem; }
  .letter p { font-size: 1.3125rem; }
  .letter .wish strong { font-size: 2rem; }
  .sign em { font-size: 1.125rem; }
  .sign strong { font-size: 3.25rem; }
  .sign span { font-size: 1.0625rem; }
  .blessings { max-width: 1300px; }
  .blessings svg { width: min(100%, 190px); }
  .tag { max-width: 200px; font-size: 1.3125rem; }
  .closing .ribbon { max-width: 1080px; font-size: 1.75rem; }
}
@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); margin-top: -8px; gap: 30px; }
  .arch-wrap { max-width: 340px; }
  .head { padding-top: 50px; }
  .letter { margin-top: 30px; }
  .flourish { width: 30px; height: 30px; }
}
/* One-screen mode for desktop and tablet: the poster is laid out at a fixed design size,
   then scaled by script to fill the window exactly, so nothing needs scrolling. */
html.fit, html.fit body { overflow: hidden; height: 100%; }
html.fit .poster {
  position: fixed;

html.fit .corner { width: 380px; }
html.fit .head { padding: 14px 60px 0; }
html.fit .head p { margin: 0; }
html.fit .from { font-size: 20px; max-width: none; }

html.fit .title-row { flex-wrap: nowrap; gap: 16px; }
html.fit .title-row .happy { order: 0; flex-basis: auto; }
html.fit .happy { font-size: 58px; }
html.fit .diwali { font-size: 108px; line-height: 1; }
html.fit .title-row svg { width: 70px; }
html.fit .fol { font-size: 19px; }
html.fit .sky { height: auto; aspect-ratio: 1000 / 420; bottom: auto; }
html.fit .city { position: absolute; left: 0; top: 100px; height: 340px; margin: 0; }
html.fit .hero {
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;

  gap: 38px;
}
html.fit .arch-wrap { width: 350px; max-width: none; padding-bottom: 22px; }
html.fit .plate strong { font-size: 21px; }
html.fit .plate span { font-size: 13px; }
html.fit .letter { margin-top: 14px; padding: 40px 42px 30px; border-radius: 26px; }
html.fit .crest { top: -32px; width: 112px; margin-left: -56px; }
html.fit .flourish { width: 30px; height: 30px; }
html.fit .letter h2 { margin-bottom: 8px; font-size: 25px; }
html.fit .letter p { margin-bottom: 8px; font-size: 17.5px; line-height: 1.45; }
html.fit .letter .wish { margin-bottom: 0; }
html.fit .letter .wish strong { font-size: 23px; }
html.fit .sign { margin-top: 10px; }
html.fit .sign em { font-size: 15px; }
html.fit .sign strong { font-size: 36px; }

html.fit .blessings { width: calc(100% - 340px); max-width: 1000px; padding: 0; gap: 16px; }
html.fit .blessings li { gap: 2px; }
html.fit .blessings svg { width: 112px; }
html.fit .tag { max-width: 150px; font-size: 16px; }
html.fit .closing { padding: 6px 60px 10px; }
html.fit .closing .ribbon { max-width: 1000px; padding: 4px 34px; font-size: 19px; }
html.fit .closing svg { width: 36px; }
html.fit .mandala { width: 230px; }

html.fit.land .floor {
  position: absolute;
  left: 50%;
  bottom: -14px;
  width: min(100%, 1400px);
  max-width: none;
  margin: 0;
  transform: translateX(-50%);
}
html.fit.land .floor-diyas { display: none; }
html.fit.land .rangoli { transform: translate(500px, 168px) scale(.86, .25); }

html.fit.tall .head { padding-top: 18px; }
html.fit.tall .corner { width: 300px; }
html.fit.tall .city { top: 100px; height: 300px; opacity: .6; }

html.fit.tall .arch-wrap { width: 320px; }
html.fit.tall .letter { padding: 42px 34px 42px; }
html.fit.tall .closing { padding-inline: 30px; }
html.fit.tall .closing .ribbon { font-size: 17px; padding-inline: 26px; }

html.fit.tall .blessings { width: calc(100% - 40px); }
html.fit.tall .blessings svg { width: 104px; }

@media (prefers-reduced-motion: reduce) {
  .fl, .gl, .tw, .swing, .diwali { animation: none; }
}
</style>

<script>
(async function () {
'use strict';
var C = window.GREETING_CONFIG;

/* ---------------- small helpers ---------------- */
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]; }); }
function f1(n) { return (+n).toFixed(1); }              // like PHP %.1f
function f2(n) { return (+n).toFixed(2); }              // like PHP %.2f
function d(n) { return String(Math.trunc(n)); }         // like PHP %d
function num(n) { return String(+(+n).toFixed(4)); }    // plain number

/* Mersenne Twister — same numbers as PHP mt_srand()/mt_rand(), so the decoration looks identical */
function MT(seed) {
  var s = new Uint32Array(624), idx = 624;
  s[0] = seed >>> 0;
  for (var i = 1; i < 624; i++) { var p = s[i - 1] ^ (s[i - 1] >>> 30); s[i] = (Math.imul(1812433253, p) + i) >>> 0; }
  function next() {
    if (idx >= 624) {
      for (var k = 0; k < 624; k++) {
        var y = (s[k] & 0x80000000) | (s[(k + 1) % 624] & 0x7fffffff);
        s[k] = s[(k + 397) % 624] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      }
      idx = 0;
    }
    var v = s[idx++];
    v ^= v >>> 11; v ^= (v << 7) & 0x9d2c5680; v ^= (v << 15) & 0xefc60000; v ^= v >>> 18;
    return v >>> 0;
  }
  return function (min, max) {
    var u = max - min + 1, r = next();
    if ((u & (u - 1)) === 0) return min + (r & (u - 1));
    var limit = 0xFFFFFFFF - (0xFFFFFFFF % u) - 1;
    while (r > limit) r = next();
    return min + (r % u);
  };
}

/* ---------------- read the token ---------------- */
function getToken() {
  var q = new URLSearchParams(location.search).get('t');
  if (q) return q.trim();
  if (location.hash.length > 1) return decodeURIComponent(location.hash.slice(1)).trim();
  var last = decodeURIComponent(location.pathname.split('/').pop() || '');
  if (/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(last) && !/\.(html?|php)$/i.test(last)) return last;
  return '';
}
var token = getToken();
var data = token ? await GreetingToken.readToken(token, C) : null;

if (!data) {
  document.body.innerHTML =
    '<main class="notice"><p class="shubh" lang="hi">शुभ दीपावली</p>' +
    '<h1>' + (token === '' ? 'Please use your personal link' : 'This link is not valid') + '</h1>' +
    '<p>Open the full link or scan the QR code again. If it still does not work, ask your team leader for a new one.</p></main>';
  return;
}

var name = String(data.name);
var first = name.trim().split(/\s+/)[0];
var dept = data.department ? String(data.department) : '';
document.title = 'Happy Diwali, ' + first;

/** Image: Image URL in token > images/{key}.jpg|jpeg|png|webp (first that loads) > initials. */
function imageCandidates() {
  if (data.image) return [String(data.image)];
  var key = name.replace(/\s+/g, '_').toLowerCase().trim().replace(/[^A-Za-z0-9_\-]/g, '');
  if (!key) return [];
  return ['jpg', 'jpeg', 'png', 'webp'].map(function (ext) { return C.IMAGE_PATTERN.replace('{key}', key).replace(/\.jpg$/, '.' + ext); });
}
function initials(n) {
  var w = n.trim().split(/\s+/);
  var i = (Array.from(w[0] || '')[0] || '') + (w.length > 1 ? (Array.from(w[w.length - 1])[0] || '') : '');
  return (i || '?').toUpperCase();
}

/* ---------------- Drawing helpers: everything below returns SVG markup ---------------- */

/** A marigold, rose or yellow flower. */
function flower(x, y, r, kind) {
  return '<use href="#m-' + (kind || 'o') + '" x="' + f1(x - r) + '" y="' + f1(y - r) + '" width="' + f1(r * 2) + '" height="' + f1(r * 2) + '"/>';

    var land = vw / vh >= 1.15, bw = land ? 1200 : 900, bh = land ? 900 : 1180;
    root.classList.add('fit');
    root.classList.toggle('land', land);
    root.classList.toggle('tall', !land);
    for (var pass = 0; pass < 4; pass++) {
      var s = Math.min(vw / bw, vh / bh), w = vw / s, ht = vh / s;
      poster.style.width = w + 'px';
      poster.style.height = ht + 'px';
      poster.style.transform = 'scale(' + s + ')';
      var bottom = closing.offsetTop + closing.offsetHeight;
      if (bottom <= ht + .5) break;
      bh *= bottom / ht;   // content is taller than expected (e.g. a long name): zoom out a little
    }
  }
  addEventListener('resize', fit);
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();

/* Fireworks: bursts over the title while it is on screen; a tap anywhere sets one off */
(function () {
  var c = document.getElementById('fx'), x = c.getContext('2d'), parts = [], last = 0, running = false;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors = ['#ff5cd0', '#ffd45c', '#b98cff', '#ff8a3c', '#7ee0ff', '#fff3c9'];
  function size() {
    var r = Math.min(devicePixelRatio || 1, 2);
    c.width = innerWidth * r; c.height = innerHeight * r;
    x.setTransform(r, 0, 0, r, 0, 0);
  }
  addEventListener('resize', size); size();
  function fire(px, py) {
    var col = colors[Math.floor(Math.random() * colors.length)], n = 54 + Math.floor(Math.random() * 30), sp = 2 + Math.random() * 2;
    for (var i = 0; i < n; i++) {
      var a = Math.PI * 2 * i / n, v = sp * (.55 + Math.random() * .5);
      parts.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: i % 5 ? col : '#fff3c9' });
    }
    start();
  }
  function start() { if (!running) { running = true; requestAnimationFrame(frame); } }
  function frame(ms) {
    x.globalCompositeOperation = 'destination-out';
    x.fillStyle = 'rgba(0,0,0,.2)';
    x.fillRect(0, 0, innerWidth, innerHeight);
    x.globalCompositeOperation = 'lighter';
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += .025; p.vx *= .985; p.vy *= .985; p.life -= .0115;
      x.globalAlpha = Math.max(p.life, 0);
      x.fillStyle = p.col;
      x.beginPath(); x.arc(p.x, p.y, 1.5, 0, 6.3); x.fill();
    });
    x.globalAlpha = 1;
    if (!reduce && ms - last > 1500 && scrollY < innerHeight * .45 && !document.hidden) {
      last = ms;
      var w = innerWidth, side = Math.random() < .5;
      fire(w * (side ? .1 + Math.random() * .2 : .7 + Math.random() * .2), 50 + Math.random() * Math.min(190, innerHeight * .25) - scrollY);
    }
    if (parts.length || !reduce) requestAnimationFrame(frame);
    else { running = false; x.clearRect(0, 0, innerWidth, innerHeight); }
  }
  document.addEventListener('click', function (e) { fire(e.clientX, e.clientY); });
  if (!reduce) start();
})();
})();
</script>
